<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<title id="t">一趟完整的旅程</title><desc id="d">六步：进站、买票、刷闸机、候车、坐车、换乘 2 号线。</desc>
