<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d2b3a">
<title>坐地铁 · 广州 3D 探险</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- 图标（SVG 符号，按钮里用 <use> 引用） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-eye3" viewBox="0 0 48 48"><circle cx="24" cy="15" r="6.5" fill="currentColor"/><path d="M13 39c0-7 5-12 11-12s11 5 11 12" fill="currentColor"/><path d="M6 30c3-3 6-4.5 9-5M42 30c-3-3-6-4.5-9-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none" opacity=".55"/></symbol>
    <symbol id="i-eye1" viewBox="0 0 48 48"><path d="M4 24s7.5-12 20-12 20 12 20 12-7.5 12-20 12S4 24 4 24z" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"/><circle cx="24" cy="24" r="6.5" fill="currentColor"/><circle cx="26.2" cy="21.8" r="2" fill="#fff"/></symbol>
    <symbol id="i-sound" viewBox="0 0 48 48"><path d="M8 19h7l10-8v26l-10-8H8z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M31 18c2 1.6 3 3.6 3 6s-1 4.4-3 6M36 13c3.4 2.8 5 6.4 5 11s-1.6 8.2-5 11" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 48 48"><path d="M8 19h7l10-8v26l-10-8H8z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M32 19l10 10M42 19L32 29" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></symbol>
    <symbol id="i-jump" viewBox="0 0 48 48"><path d="M24 7L10 22h8v10h12V22h8z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><rect x="16" y="36" width="16" height="4.5" rx="2.25" fill="currentColor" opacity=".55"/></symbol>
    <symbol id="i-metro" viewBox="0 0 48 48"><rect x="9" y="5" width="30" height="31" rx="9" fill="currentColor"/><rect x="14" y="11" width="20" height="10" rx="3" fill="#fff" opacity=".92"/><circle cx="17" cy="28.5" r="2.6" fill="#fff"/><circle cx="31" cy="28.5" r="2.6" fill="#fff"/><path d="M15 36l-5 7M33 36l5 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></symbol>
    <symbol id="i-tvm" viewBox="0 0 48 48"><rect x="9" y="4" width="30" height="40" rx="5" fill="currentColor"/><rect x="13" y="9" width="15" height="12" rx="2" fill="#fff" opacity=".92"/><rect x="31" y="10" width="3.5" height="7" rx="1.5" fill="#FFC72C"/><rect x="30" y="20" width="6" height="2.6" rx="1.3" fill="#3DDC84"/><rect x="15" y="33" width="18" height="6" rx="2" fill="#fff" opacity=".85"/><circle cx="24" cy="36" r="2.3" fill="#1E9E8F"/></symbol>
    <symbol id="i-token" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="currentColor"/><circle cx="24" cy="24" r="12.5" fill="none" stroke="#fff" stroke-width="2.6" opacity=".8"/><path d="M18 27v-7.5a6 6 0 0 1 12 0V27M17 27h14" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-card" viewBox="0 0 48 48"><rect x="5" y="11" width="38" height="26" rx="5" fill="currentColor"/><rect x="10" y="17" width="9" height="7" rx="1.5" fill="#FFD66B"/><path d="M28 21c2 1.5 2 4.5 0 6M32 18.5c3.5 3 3.5 8 0 11" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-coin" viewBox="0 0 48 48"><ellipse cx="24" cy="30" rx="15" ry="6" fill="currentColor" opacity=".55"/><ellipse cx="24" cy="22" rx="15" ry="6" fill="currentColor"/><path d="M24 4v10M19 9l5 5 5-5" stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 48 48"><path d="M14 14l20 20M34 14L14 34" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 48 48"><path d="M29 10L15 24l14 14" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 48 48"><path d="M24 5L9 24h9v17h12V24h9z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-seat" viewBox="0 0 48 48"><path d="M12 8v18a4 4 0 0 0 4 4h18" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="10" y="28" width="28" height="6" rx="3" fill="currentColor"/><path d="M14 34v8M34 34v8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="25" cy="13" r="5" fill="currentColor" opacity=".6"/></symbol>
    <symbol id="i-stand" viewBox="0 0 48 48"><circle cx="24" cy="9" r="5.5" fill="currentColor"/><path d="M24 16v14M24 30l-6 12M24 30l6 12M15 22l9-4 9 4" stroke="currentColor" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-wave" viewBox="0 0 48 48"><path d="M17 26V12a3 3 0 0 1 6 0v11M23 22V9a3 3 0 0 1 6 0v13M29 22V11a3 3 0 0 1 6 0v15c0 9-5 15-12 15-5 0-8-3-11-8l-5-8a3 3 0 0 1 5-3l4 5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 8c2 1.5 3.5 4 3.5 6.5M6 10c-1.5 2-2 4-1.5 6.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none" opacity=".6"/></symbol>
    <symbol id="i-ask" viewBox="0 0 48 48"><path d="M8 10h32a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H22l-9 8v-8H8a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z" fill="currentColor" opacity=".18"/><path d="M8 10h32a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H22l-9 8v-8H8a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M19 18a5 5 0 1 1 7 4.6c-1.4.6-2 1.6-2 3V27" stroke="currentColor" stroke-width="3.4" fill="none" stroke-linecap="round"/><circle cx="24" cy="31" r="2.2" fill="currentColor"/></symbol>
    <symbol id="i-map" viewBox="0 0 48 48"><path d="M6 12l11-5 14 5 11-5v29l-11 5-14-5-11 5z" fill="currentColor" opacity=".25"/><path d="M6 12l11-5 14 5 11-5v29l-11 5-14-5-11 5z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M10 28h28" stroke="#F3D03E" stroke-width="4" stroke-linecap="round"/><path d="M24 11v28" stroke="#00629B" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="28" r="4" fill="#fff" stroke="currentColor" stroke-width="2"/></symbol>
  </defs>
</svg>
<canvas id="c" touch-action="none"></canvas>

<!-- 触摸层：左半边摇杆，右半边拖动转视角 / 双指缩放 -->
<div id="touch"></div>
<div id="stick" hidden><i class="chev u"></i><i class="chev d"></i><i class="chev l"></i><i class="chev r"></i><div class="knob"></div></div>
<div id="stickHint"><i class="chev u"></i><i class="chev d"></i><i class="chev l"></i><i class="chev r"></i><div class="knob"></div></div>

<!-- HUD -->
<div id="hud">
  <div id="where" class="glass">
    <span class="line" id="whereLine">1号线</span>
    <span class="names"><span class="name" id="whereName">公园前</span><span class="en" id="whereEn">Gongyuanqian</span></span>
  </div>
  <div id="next" class="glass dark" hidden></div>
  <div id="btns">
    <button id="bMap" class="btn glass" aria-label="线路图"><svg class="ico"><use href="#i-map"/></svg><span class="lbl">地图</span></button>
    <button id="bView" class="btn glass" aria-label="切换第一/第三人称"><svg class="ico"><use href="#i-eye3"/></svg><span class="lbl">视角</span></button>
    <button id="bMute" class="btn glass" aria-label="声音"><svg class="ico"><use href="#i-sound"/></svg><span class="lbl">声音</span></button>
  </div>
  <button id="bJump" class="btn big" aria-label="跳"><svg class="ico"><use href="#i-jump"/></svg><span class="lbl">跳</span></button>
  <button id="bAct" class="btn big act" hidden aria-label="动作"><svg class="ico"><use href="#i-tvm"/></svg><span class="lbl">买票</span></button>
  <div id="inv" class="glass" hidden></div>
  <div id="hint" class="glass" hidden><span class="no"><svg class="ico"><use href="#i-close"/></svg></span><span class="txt"><b>先去买票哦</b><span class="dir">售票机在这边</span></span><span class="dirarr"><svg class="ico arr"><use href="#i-arrow"/></svg></span></div>
  <div id="toast" class="glass" hidden></div>
</div>
<div id="tvm" hidden></div>
<div id="netmap" hidden><div class="sheet glass"><header><div class="ttl"><svg class="ico"><use href="#i-map"/></svg><b>线路图</b><small>1 号线 · 2 号线</small></div><button class="x" data-act="close" aria-label="关闭"><svg class="ico"><use href="#i-close"/></svg></button></header><div class="mapbox"></div></div></div>
<div id="caption" class="glass dark" hidden><span class="lang"></span><span class="text"></span></div>

<div id="loading">
  <div class="box">
    <svg class="logo"><use href="#i-metro"/></svg>
    <div class="title">坐地铁 · 广州</div>
    <div class="sub">Guangzhou Metro 3D</div>
    <div id="loadTrack" style="--line:#F3D03E">
      <div class="rail"><i id="loadBar"></i></div>
      <div id="loadDots"></div>
      <div id="loadTrain"><svg><use href="#i-metro"/></svg></div>
    </div>
    <div id="loadStation">西塱</div>
    <div id="loadMsg">列车正在进站…</div>
    <div id="loadFactBox"><span class="tag">地铁小知识</span><span id="loadFact"></span></div>
  </div>
</div>

<script src="js/loading.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
