<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#9fd8f5">
<title>坐地铁 · 广州 3D 探险</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="c" touch-action="none"></canvas>

<!-- 触摸层：左半边摇杆，右半边拖动转视角 / 双指缩放 -->
<div id="touch"></div>
<div id="stick" hidden><div class="knob"></div></div>
<div id="stickHint"><div class="knob"></div></div>

<!-- HUD -->
<div id="hud">
  <div id="where"><span class="line" id="whereLine">1号线</span><span class="name" id="whereName">公园前</span><span class="en" id="whereEn">Gongyuanqian</span></div>
  <div id="next" hidden></div>
  <div id="btns">
    <button id="bView" class="btn" aria-label="切换第一/第三人称"><span class="ico">👁️</span><span class="lbl">视角</span></button>
    <button id="bFoot" class="btn" aria-label="发光脚印"><span class="ico">💡</span><span class="lbl">脚印</span></button>
    <button id="bMute" class="btn" aria-label="声音"><span class="ico">🔊</span><span class="lbl">声音</span></button>
  </div>
  <button id="bJump" class="btn big" aria-label="跳"><span class="ico">⬆</span><span class="lbl">跳</span></button>
  <div id="toast" hidden></div>
</div>
<div id="caption" hidden><span class="lang"></span><span class="text"></span></div>

<div id="loading"><div class="box"><div class="title">坐地铁 · 广州</div><div class="bar"><i id="loadBar"></i></div><div id="loadMsg">正在加载 3D 引擎…</div></div></div>

<script src="js/boot.js"></script>
</body>
</html>
